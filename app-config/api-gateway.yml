spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identidad
              uri: lb://identidad-service
              predicates:
                - Path=/usuarios/**, /roles/**
            
            - id: marketplace
              uri: lb://marketplace-service
              predicates:
                - Path=/vendedores/**, /productos/**, /tiendas/**, /categorias/**
            
            - id: inventario
              uri: lb://inventario-service
              predicates:
                - Path=/bodegas/**, /inventarios/**, /movimientos/**
            
            - id: carrito
              uri: lb://carrito-service
              predicates:
                - Path=/carrito/**, /items/**
            
            - id: ordenes
              uri: lb://ordenes-service
              predicates:
                - Path=/ordenes/**, /historial/**, /estados/**, /detalle/**
            
            - id: pagos
              uri: lb://pagos-service
              predicates:
                - Path=/pagos/**, /transacciones/**, /estadoPago/**, /reembolsos/**
            
            - id: logistica
              uri: lb://logistica-service
              predicates:
                - Path=/comunas/**, /direcciones/**, /envios/**, /regiones/**
            
            - id: resenas
              uri: lb://resenas-service
              predicates:
                - Path=/reacciones/**, /resenas/**

server:
  port: 8090
  address: 0.0.0.0

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true