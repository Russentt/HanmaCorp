      SPRING_APPLICATION_NAME: marketplace-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
