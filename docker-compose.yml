version: "3.8"

services:
  mysql-db:
    restart: always
    image: mysql:8.0
    container_name: mysql_database
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - ./crear_bases_de_datos.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

  eureka-service:
    restart: always
    build:
      context: ./eureka-service
      dockerfile: Dockerfile
    container_name: eureka-service
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    entrypoint: sh -c "sleep 15 && java -jar app.jar"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

  config-server:
    restart: always
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/app-config
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
    ports:
      - "8888:8888"
    volumes:
      - ./app-config:/app-config

  identidad-service:
    restart: always
    build:
      context: ./identidad-service
      dockerfile: Dockerfile
    container_name: identidad-service
    depends_on:
      - config-server
      - mysql-db
      - eureka-service
    entrypoint: sh -c "sleep 15 && java -jar app.jar"
    environment:
      SPRING_APPLICATION_NAME: identidad-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-service:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/bd_identidades
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""

  marketplace-service:
    restart: always
    build:
      context: ./marketplace-service
      dockerfile: Dockerfile
    container_name: marketplace-service
